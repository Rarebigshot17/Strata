# Kubernetes (Prometheus Operator): Strata behind a Service whose port (8101 in the container) is named "http".
# GET /metrics answers Prometheus in the text format (docs/DETAILS.md#monitoring).
# The API key lives in a Secret (key "key"), sent as a bearer token; without an API key, remove the authorization block.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: strata
  labels:
    release: kube-prometheus-stack   # whatever your Prometheus selects ServiceMonitors by
spec:
  selector:
    matchLabels:
      app: strata
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: strata-api-key
          key: key
